mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
find-process-mode: strict

profile:
  store-selected: false
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

proxies:
  - name: "US-OpenAI-45.207.206.66-443"
    type: ss
    server: 45.207.206.66
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "8d0cb91dd5dbb82c2d82f1ccd22d8bd7"
    udp: true
  - name: "US-OpenAI-45.207.206.66-8388"
    type: ss
    server: 45.207.206.66
    port: 8388
    cipher: chacha20-ietf-poly1305
    password: "8d0cb91dd5dbb82c2d82f1ccd22d8bd7"
    udp: true
  - name: "HK-YouTube-38.76.185.98-443"
    type: ss
    server: 38.76.185.98
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "b3f64044a9cee6dcf0309d1d49ec68ee"
    udp: true
  - name: "HK-YouTube-38.76.185.98-8388"
    type: ss
    server: 38.76.185.98
    port: 8388
    cipher: chacha20-ietf-poly1305
    password: "b3f64044a9cee6dcf0309d1d49ec68ee"
    udp: true

proxy-groups:
  - name: OpenAI-US
    type: select
    proxies:
      - "US-OpenAI-45.207.206.66-443"
      - "US-OpenAI-45.207.206.66-8388"
  - name: HK-Proxy
    type: select
    proxies:
      - "HK-YouTube-38.76.185.98-443"
      - "HK-YouTube-38.76.185.98-8388"
  - name: PROXY
    type: select
    proxies:
      - HK-Proxy
      - OpenAI-US
      - "HK-YouTube-38.76.185.98-443"
      - "US-OpenAI-45.207.206.66-443"

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - DOMAIN-SUFFIX,localhost,DIRECT

  - DOMAIN-SUFFIX,chatgpt.com,OpenAI-US
  - DOMAIN-SUFFIX,openai.com,OpenAI-US
  - DOMAIN-SUFFIX,chat.com,OpenAI-US
  - DOMAIN-SUFFIX,auth.openai.com,OpenAI-US
